services:
  api:
    build: ./skillwiki
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?Set LLM_API_KEY in your shell or local .env}
      LLM_API_URL: ${LLM_API_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-16384}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
    volumes:
      - skillwiki-data:/data
      - skillwiki-receipts:/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
  frontend:
    build: ./skillwiki-frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  skillwiki-data:
  skillwiki-receipts:
