worker_processes auto;
pid /tmp/skillwiki-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/skillwiki-client-body;
    proxy_temp_path /tmp/skillwiki-proxy;
    fastcgi_temp_path /tmp/skillwiki-fastcgi;
    uwsgi_temp_path /tmp/skillwiki-uwsgi;
    scgi_temp_path /tmp/skillwiki-scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 7860;
        root /app/frontend;
        index index.html;
        client_max_body_size 10m;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        location /api/ { proxy_pass http://127.0.0.1:8000; }
        location = /health { proxy_pass http://127.0.0.1:8000; }
        location = /openapi.json { proxy_pass http://127.0.0.1:8000; }
        location = /docs { proxy_pass http://127.0.0.1:8000; }
        location /ws {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
