name: Product checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "./skillwiki[api,dev]"
      - run: python -m pytest skillwiki/tests/test_cli_contract.py skillwiki/tests/test_report_skillsbench_mapping.py skillwiki/tests/test_portable_configuration.py -o addopts= -q
      - run: python public-experiments/verify.py
      - run: python -m pytest skillwiki/tests/test_evolution_repair_persistence.py skillwiki/tests/test_new_version_metadata.py skillwiki/tests/test_skill_governance_branch_review.py -o addopts= -q
      - run: python -m unittest discover -s deploy/huggingface -p 'test_*.py'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillwiki-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: skillwiki-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node scripts/test-maintenance-proposal.mjs
      - run: npm run build
  space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export public deployment package
        run: python deploy/huggingface/prepare_space.py ../space-upload
      - name: Build reviewed Space package
        run: docker build -t skillwiki-space-ci ../space-upload
      - name: Native smoke and restart readback
        run: |
          docker run -d --name skillwiki-space-ci -p 127.0.0.1:17860:7860 -e LLM_API_KEY=offline-smoke-not-a-real-key -e SPACE_MODEL_BUDGET_CNY=1 -v space-ci-data:/data skillwiki-space-ci
          python deploy/huggingface/smoke.py --output /tmp/space-smoke.json
          docker restart skillwiki-space-ci
          python deploy/huggingface/smoke.py --readback /tmp/space-smoke.json
      - name: Container logs
        if: failure()
        run: docker logs --tail 100 skillwiki-space-ci
      - name: Clean isolated Space
        if: always()
        run: docker rm -f skillwiki-space-ci; docker volume rm space-ci-data
  containers:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: offline-container-check
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Start isolated deployment and check persistence
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8080/wiki
          curl --fail http://localhost:8080/api/v1/skills?limit=1
          docker compose exec -T api sh -c 'echo retained > /data/persistence-check'
          docker compose up -d --force-recreate --wait --wait-timeout 180
          docker compose exec -T api sh -c 'test "$(cat /data/persistence-check)" = retained'
      - name: Container logs
        if: failure()
        run: docker compose logs --tail 100
      - name: Clean isolated deployment
        if: always()
        run: docker compose down --volumes
